name: Deploy WhatsApp Webhook

# Force redeploy after production formatter fix
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/whatsapp-webhook/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-whatsapp-webhook.yml'

jobs:
  deploy-whatsapp-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy whatsapp-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy whatsapp-webhook --project-ref kcgsxxwgzrmsnnxvpkvi
