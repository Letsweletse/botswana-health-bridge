name: Deploy ChekaMeds Edge Functions

# MANUAL ONLY. The repo copy of ultramsg-webhook now mirrors the live v200
# (copied from the Supabase dashboard on 25 Oct 2026). Deploys stay manual so a
# push can never replace the live bot by accident. Run this workflow by hand only
# after a reviewed change, or deploy by pasting in the Supabase dashboard.
on:
  workflow_dispatch:

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ultramsg-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ultramsg-webhook --project-ref kcgsxxwgzrmsnnxvpkvi --no-verify-jwt

      - name: Deploy whatsapp-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy whatsapp-webhook --project-ref kcgsxxwgzrmsnnxvpkvi --no-verify-jwt

      - name: Deploy checkout-reservation if present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d "supabase/functions/checkout-reservation" ]; then
            supabase functions deploy checkout-reservation --project-ref kcgsxxwgzrmsnnxvpkvi
          else
            echo "checkout-reservation function folder not found; skipping."
          fi

      - name: Deploy chekapay-webhook if present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d "supabase/functions/chekapay-webhook" ]; then
            supabase functions deploy chekapay-webhook --project-ref kcgsxxwgzrmsnnxvpkvi
          else
            echo "chekapay-webhook function folder not found; skipping."
          fi

      - name: Deploy admin-sync-users if present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d "supabase/functions/admin-sync-users" ]; then
            supabase functions deploy admin-sync-users --project-ref kcgsxxwgzrmsnnxvpkvi
          else
            echo "admin-sync-users function folder not found; skipping."
          fi
