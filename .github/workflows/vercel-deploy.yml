name: Deploy ChekaMeds to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Vercel (verbose)
        run: |
          vercel --version
          vercel whoami --token ${{ secrets.VERCEL_TOKEN }} || echo "whoami failed"
          vercel deploy ./dist --prod --yes --name chekameds             --token ${{ secrets.VERCEL_TOKEN }} 2>&1 || true
          vercel deploy ./dist --prod --yes             --token ${{ secrets.VERCEL_TOKEN }} 2>&1
