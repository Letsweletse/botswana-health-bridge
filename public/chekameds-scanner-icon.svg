<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#0d1f2d"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="85" x2="512" y2="85"/>
    <line x1="0" y1="170" x2="512" y2="170"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="341" x2="512" y2="341"/>
    <line x1="0" y1="426" x2="512" y2="426"/>
    <line x1="85" y1="0" x2="85" y2="512"/>
    <line x1="170" y1="0" x2="170" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="341" y1="0" x2="341" y2="512"/>
    <line x1="426" y1="0" x2="426" y2="512"/>
  </g>

  <!-- Outer scanner frame - corner brackets -->
  <!-- Top Left -->
  <path d="M 130 110 L 130 150 M 130 110 L 170 110" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Top Right -->
  <path d="M 382 110 L 342 110 M 382 110 L 382 150" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Bottom Left -->
  <path d="M 130 402 L 130 362 M 130 402 L 170 402" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Bottom Right -->
  <path d="M 382 402 L 342 402 M 382 402 L 382 362" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Scanner viewfinder box -->
  <rect x="130" y="110" width="252" height="292" rx="12" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.15"/>

  <!-- Barcode lines inside scanner -->
  <g opacity="0.9" filter="url(#glow)">
    <!-- Thick bars -->
    <rect x="160" y="170" width="8" height="120" rx="2" fill="#10b981"/>
    <rect x="178" y="170" width="4" height="120" rx="1" fill="#34d399"/>
    <rect x="190" y="170" width="10" height="120" rx="2" fill="#10b981"/>
    <rect x="208" y="170" width="4" height="120" rx="1" fill="#34d399"/>
    <rect x="218" y="170" width="6" height="120" rx="1" fill="#10b981"/>
    <rect x="232" y="170" width="8" height="120" rx="2" fill="#10b981"/>
    <rect x="248" y="170" width="4" height="120" rx="1" fill="#34d399"/>
    <rect x="260" y="170" width="10" height="120" rx="2" fill="#10b981"/>
    <rect x="278" y="170" width="4" height="120" rx="1" fill="#34d399"/>
    <rect x="290" y="170" width="6" height="120" rx="1" fill="#10b981"/>
    <rect x="304" y="170" width="8" height="120" rx="2" fill="#10b981"/>
    <rect x="320" y="170" width="4" height="120" rx="1" fill="#34d399"/>
    <rect x="330" y="170" width="10" height="120" rx="2" fill="#10b981"/>
    <rect x="348" y="170" width="4" height="120" rx="1" fill="#34d399"/>
  </g>

  <!-- Scan line -->
  <rect x="148" y="228" width="216" height="3" rx="1.5" fill="#10b981" opacity="0.9" filter="url(#softglow)"/>
  <!-- Scan line glow -->
  <rect x="148" y="226" width="216" height="7" rx="3" fill="#10b981" opacity="0.2"/>

  <!-- Medicine pill icon below barcode -->
  <g transform="translate(256, 330)">
    <!-- Pill shape -->
    <rect x="-36" y="-14" width="72" height="28" rx="14" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="2"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <!-- Left half filled -->
    <path d="M -36 0 a14 14 0 0 1 14 -14 L 0 -14 L 0 14 L -22 14 a14 14 0 0 1 -14 -14 Z" fill="#10b981" opacity="0.4"/>
  </g>

  <!-- ChekaMeds text -->
  <text x="256" y="430" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">
    Cheka<tspan fill="#10b981">Meds</tspan>
  </text>

  <!-- Scanner label -->
  <text x="256" y="456" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="middle" letter-spacing="3">
    SCANNER
  </text>

  <!-- Top label -->
  <text x="256" y="88" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="4" opacity="0.7">
    PHARMACY
  </text>

  <!-- Corner accent dots -->
  <circle cx="130" cy="110" r="4" fill="#10b981" filter="url(#glow)"/>
  <circle cx="382" cy="110" r="4" fill="#10b981" filter="url(#glow)"/>
  <circle cx="130" cy="402" r="4" fill="#10b981" filter="url(#glow)"/>
  <circle cx="382" cy="402" r="4" fill="#10b981" filter="url(#glow)"/>
</svg>
