<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#10b981"/>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"/>
<title>ChekaMeds Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0f1a;color:#f1f5f9;min-height:100vh;overflow-x:hidden}
.hide{display:none!important}
/* LOGIN */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo-box{text-align:center;margin-bottom:32px}
.logo-icon{width:80px;height:80px;background:linear-gradient(135deg,#10b981,#059669);border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;box-shadow:0 8px 32px rgba(16,185,129,.4)}
.logo-box h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.logo-box p{font-size:12px;color:#6b7280;margin-top:4px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.card{background:#111827;border:1px solid #1f2937;border-radius:20px;padding:28px;width:100%;max-width:400px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.field input{width:100%;background:#0a0f1a;border:1.5px solid #1f2937;border-radius:12px;padding:14px 16px;font-size:16px;color:#f1f5f9;outline:none}
.field input:focus{border-color:#10b981}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:50px}
.pw-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280;padding:4px;touch-action:manipulation}
.show-pw{font-size:12px;color:#10b981;cursor:pointer;margin-top:6px;display:inline-block;touch-action:manipulation}
.err-box{background:#450a0a;border:1px solid #7f1d1d;border-radius:10px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:14px}
.btn-primary{width:100%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 20px rgba(16,185,129,.4)}
.btn-primary:disabled{opacity:.6}
/* HEADER */
#header{background:#111827;border-bottom:1px solid #1f2937;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:8px}
.brand-name{font-size:15px;font-weight:800}
.brand-badge{font-size:11px;background:#10b981;color:#fff;border-radius:6px;padding:2px 8px;font-weight:700}
.clinic-name{font-size:11px;color:#6b7280;margin-top:2px}
.signout{background:none;border:1px solid #1f2937;border-radius:8px;padding:6px 14px;color:#6b7280;font-size:13px;cursor:pointer;touch-action:manipulation}
/* MAIN */
#main{padding:16px;max-width:480px;margin:0 auto}
/* VIEWFINDER */
.vf{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#video{width:100%;height:100%;object-fit:cover;display:block}
.vf-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0a0f1a}
.vf-idle-icon{width:64px;height:64px;background:#10b981;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px}
.vf-idle h3{font-size:16px;font-weight:700}
.vf-idle p{font-size:13px;color:#6b7280}
.vf-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000}
.vf-active-overlay{position:absolute;inset:0;pointer-events:none}
.scan-window{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78%;height:110px}
.corner{position:absolute;width:24px;height:24px}
.c-tl{top:0;left:0;border-top:3px solid #10b981;border-left:3px solid #10b981;border-radius:6px 0 0 0}
.c-tr{top:0;right:0;border-top:3px solid #10b981;border-right:3px solid #10b981;border-radius:0 6px 0 0}
.c-bl{bottom:0;left:0;border-bottom:3px solid #10b981;border-left:3px solid #10b981;border-radius:0 0 0 6px}
.c-br{bottom:0;right:0;border-bottom:3px solid #10b981;border-right:3px solid #10b981;border-radius:0 0 6px 0}
.laser{position:absolute;left:4px;right:4px;height:2px;background:linear-gradient(90deg,transparent,#10b981,#34d399,#10b981,transparent);box-shadow:0 0 12px #10b981;animation:laser 2s ease-in-out infinite}
@keyframes laser{0%{top:8px}50%{top:calc(100% - 10px)}100%{top:8px}}
.vf-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:13px}
.torch-btn{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.6);border:none;border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer;touch-action:manipulation}
.close-cam{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.6);border:none;border-radius:12px;width:44px;height:44px;font-size:18px;color:#fff;cursor:pointer;touch-action:manipulation}
.flash{position:absolute;inset:0;background:rgba(16,185,129,.3);pointer-events:none;opacity:0;transition:opacity .3s}
/* BUTTONS */
.scan-btn{width:100%;padding:18px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:16px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(16,185,129,.4);margin-top:14px}
.search-toggle{width:100%;padding:14px;background:transparent;border:1px solid #1f2937;border-radius:14px;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.search-row{display:flex;gap:8px;margin-top:10px}
.search-input{flex:1;background:#111827;border:1.5px solid #10b981;border-radius:14px;padding:14px;font-size:15px;color:#f1f5f9;outline:none}
.search-go{padding:0 20px;background:#10b981;border:none;border-radius:14px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}
.search-x{padding:0 14px;background:transparent;border:1px solid #1f2937;border-radius:14px;color:#6b7280;cursor:pointer;font-size:18px;touch-action:manipulation}
/* NOTICE */
.notice{padding:14px 16px;border-radius:14px;font-size:14px;font-weight:600;margin-top:12px}
.notice.ok{background:#022c22;border:1px solid rgba(16,185,129,.3);color:#34d399}
.notice.err{background:#1c0a0a;border:1px solid rgba(239,68,68,.3);color:#f87171}
/* RESULT */
.result-area{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.back-btn{background:none;border:none;color:#6b7280;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;gap:6px;padding:0}
.med-card{background:#111827;border:1px solid rgba(16,185,129,.2);border-radius:16px;padding:20px}
.med-found{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#10b981;margin-bottom:8px}
.med-name{font-size:20px;font-weight:800;margin-bottom:4px}
.med-meta{font-size:13px;color:#6b7280;margin-bottom:14px}
.med-stock-row{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid #1f2937}
.stock-num{font-size:44px;font-weight:800;line-height:1}
.stock-num.low{color:#ef4444}
.stock-num.ok{color:#10b981}
.stock-label{font-size:11px;color:#6b7280;margin-top:2px}
.med-info{text-align:right;font-size:12px;color:#6b7280}
/* MOVEMENT */
.section-title{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.move-btn{padding:14px 10px;border:1.5px solid #1f2937;border-radius:14px;background:#111827;color:#6b7280;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;gap:8px;transition:all .15s}
.move-btn.active{border-color:#10b981;background:rgba(16,185,129,.1);color:#10b981}
/* QTY */
.qty-row{display:flex;align-items:center;justify-content:space-between;background:#111827;border-radius:16px;border:1px solid #1f2937;padding:8px}
.qty-btn{width:52px;height:52px;border-radius:12px;border:none;font-size:26px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;font-weight:300}
.qty-minus{background:rgba(255,255,255,.05);color:#f1f5f9}
.qty-plus{background:rgba(16,185,129,.15);color:#10b981}
.qty-val{font-size:36px;font-weight:800;min-width:80px;text-align:center;background:none;border:none;color:#f1f5f9;outline:none}
/* CONFIRM */
.confirm-btn{width:100%;padding:18px;border:none;border-radius:16px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 20px rgba(16,185,129,.4)}
.confirm-btn:disabled{background:#1f2937;box-shadow:none}
/* SPINNER */
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.big-spin{width:44px;height:44px;border:3px solid #1f2937;border-top-color:#10b981;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login">
  <div class="logo-box">
    <div class="logo-icon">📷</div>
    <h1>ChekaMeds</h1>
    <p>Pharmacy Scanner</p>
  </div>
  <div class="card">
    <div class="field">
      <label>Email</label>
      <input type="email" id="em" placeholder="pharmacy@email.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password"/>
        <button class="pw-eye" id="eyeBtn" type="button">👁</button>
      </div>
      <span class="show-pw" id="showPw">Show password</span>
    </div>
    <div class="err-box hide" id="loginErr"></div>
    <button class="btn-primary" id="loginBtn" type="button">Sign In</button>
  </div>
</div>

<!-- ══ SCANNER ══ -->
<div id="app" class="hide">
  <div id="header">
    <div>
      <div class="brand">
        <span class="brand-name">ChekaMeds</span>
        <span class="brand-badge">Scanner</span>
      </div>
      <div class="clinic-name" id="clinicTxt">Loading...</div>
    </div>
    <button class="signout" id="signoutBtn">Sign out</button>
  </div>

  <div id="main">
    <!-- VIEWFINDER -->
    <div class="vf" id="vf">
      <video id="video" playsinline muted autoplay></video>
      <div class="vf-idle" id="vfIdle">
        <div class="vf-idle-icon">📷</div>
        <h3>Ready to Scan</h3>
        <p>Tap below to start camera</p>
      </div>
      <div class="vf-loading hide" id="vfLoad">
        <div class="big-spin"></div>
        <p style="color:#6b7280;font-size:14px;margin-top:14px">Starting camera...</p>
      </div>
      <div class="vf-active-overlay hide" id="vfActive">
        <div class="scan-window">
          <div class="corner c-tl"></div>
          <div class="corner c-tr"></div>
          <div class="corner c-bl"></div>
          <div class="corner c-br"></div>
          <div class="laser"></div>
        </div>
        <div class="vf-hint">Align barcode within frame</div>
      </div>
      <div class="flash" id="flash"></div>
      <button class="torch-btn hide" id="torchBtn" type="button">🔦</button>
      <button class="close-cam hide" id="closeBtn" type="button">✕</button>
    </div>

    <!-- SCAN + SEARCH BUTTONS -->
    <div id="scanArea">
      <button class="scan-btn" id="scanBtn" type="button">📷 &nbsp;Scan Barcode</button>
      <button class="search-toggle" id="searchToggle" type="button">🔍 &nbsp;Type medicine name or barcode</button>
      <div class="search-row hide" id="searchRow">
        <input class="search-input" id="searchInput" type="text" placeholder="Medicine name or barcode..."/>
        <button class="search-go" id="searchGo" type="button">Find</button>
        <button class="search-x" id="searchX" type="button">✕</button>
      </div>
    </div>

    <!-- NOTICE -->
    <div class="notice hide" id="notice"></div>

    <!-- BUSY -->
    <div class="hide" id="busyBox" style="text-align:center;padding:24px">
      <div class="big-spin"></div>
      <p style="color:#6b7280;font-size:14px;margin-top:14px">Looking up medicine...</p>
    </div>

    <!-- RESULT -->
    <div class="result-area hide" id="resultArea">
      <button class="back-btn" id="backBtn" type="button">↩ Scan another</button>
      <div class="med-card">
        <div class="med-found">✓ Medicine Found</div>
        <div class="med-name" id="rName"></div>
        <div class="med-meta" id="rMeta"></div>
        <div class="med-stock-row">
          <div>
            <div class="stock-num" id="rStock"></div>
            <div class="stock-label">units in stock</div>
          </div>
          <div class="med-info">
            <div id="rLocation"></div>
            <div id="rBarcode" style="font-family:monospace;font-size:11px;margin-top:4px"></div>
          </div>
        </div>
      </div>
      <div>
        <div class="section-title">Stock Movement</div>
        <div class="move-grid">
          <button class="move-btn active" data-type="stock_out" type="button">📤 Stock Out</button>
          <button class="move-btn" data-type="stock_in" type="button">📥 Stock In</button>
          <button class="move-btn" data-type="return" type="button">🔄 Return</button>
          <button class="move-btn" data-type="adjustment" type="button">⚖️ Adjust</button>
        </div>
      </div>
      <div>
        <div class="section-title" id="qtyTitle">Quantity</div>
        <div class="qty-row">
          <button class="qty-btn qty-minus" id="qtyMinus" type="button">−</button>
          <input class="qty-val" id="qtyVal" type="number" value="1" min="1" inputmode="numeric"/>
          <button class="qty-btn qty-plus" id="qtyPlus" type="button">+</button>
        </div>
      </div>
      <button class="confirm-btn" id="confirmBtn" type="button">✓ &nbsp;Confirm Stock Out</button>
    </div>
  </div>
</div>

<script>
var SUPA = 'https://kcgsxxwgzrmsnnxvpkvi.supabase.co';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjZ3N4eHdnenJtc25ueHZwa3ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njc4NjcsImV4cCI6MjA5NDI0Mzg2N30.k7YPpQozgvFxATCgs61YOe_jyMTreifxNydOWgX_ZqM';
var STOCK = SUPA + '/functions/v1/stock-transaction';

var sess = null, inv = null, moveType = 'stock_out';
var camStream = null, detector = null, scanning = false, frameId = 0;

/* ── HELPERS ── */
function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hide'); }
function hide(id){ $(id).classList.add('hide'); }
function showNotice(msg, ok){
  var el = $('notice');
  el.textContent = msg;
  el.className = 'notice ' + (ok ? 'ok' : 'err');
}
function hideNotice(){ $('notice').className = 'notice hide'; }

/* ── SHOW/HIDE PASSWORD ── */
function togglePw(){
  var inp = $('pw');
  var isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  $('eyeBtn').textContent = isText ? '👁' : '🙈';
  $('showPw').textContent = isText ? 'Show password' : 'Hide password';
}
$('eyeBtn').addEventListener('click', togglePw);
$('eyeBtn').addEventListener('touchend', function(e){ e.preventDefault(); togglePw(); });
$('showPw').addEventListener('click', togglePw);
$('showPw').addEventListener('touchend', function(e){ e.preventDefault(); togglePw(); });

/* ── LOGIN ── */
function doLogin(){
  var email = $('em').value.trim();
  var pw    = $('pw').value;
  var btn   = $('loginBtn');
  var err   = $('loginErr');
  hide('loginErr');
  if (!email || !pw){
    err.textContent = 'Enter email and password';
    show('loginErr'); return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> &nbsp;Signing in...';
  fetch(SUPA + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {'Content-Type':'application/json','apikey': KEY},
    body: JSON.stringify({email: email, password: pw})
  })
  .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
  .then(function(res){
    if (!res.ok) throw new Error(res.d.error_description || res.d.msg || 'Invalid credentials');
    sess = res.d;
    localStorage.setItem('cm_sess', JSON.stringify(res.d));
    loadProfile(res.d);
  })
  .catch(function(e){
    err.textContent = e.message || 'Login failed';
    show('loginErr');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });
}
$('loginBtn').addEventListener('click', doLogin);
$('loginBtn').addEventListener('touchend', function(e){ e.preventDefault(); doLogin(); });

function loadProfile(s){
  fetch(SUPA + '/rest/v1/profiles?id=eq.' + s.user.id + '&select=clinic_name&limit=1', {
    headers: {'apikey': KEY, 'Authorization': 'Bearer ' + s.access_token}
  })
  .then(function(r){ return r.json(); })
  .then(function(p){
    $('clinicTxt').textContent = (p && p[0] && p[0].clinic_name) ? p[0].clinic_name : 'Scanner';
  })
  .catch(function(){ $('clinicTxt').textContent = 'Scanner'; })
  .finally(function(){
    hide('login');
    show('app');
  });
}

/* ── CHECK STORED SESSION ── */
(function(){
  try {
    var stored = localStorage.getItem('cm_sess');
    if (!stored) return;
    var s = JSON.parse(stored);
    if (!s || !s.access_token) return;
    sess = s;
    fetch(SUPA + '/auth/v1/user', {
      headers: {'apikey': KEY, 'Authorization': 'Bearer ' + s.access_token}
    }).then(function(r){
      if (r.ok) { loadProfile(s); }
      else { localStorage.removeItem('cm_sess'); sess = null; }
    }).catch(function(){ localStorage.removeItem('cm_sess'); sess = null; });
  } catch(e){}
})();

/* ── SIGN OUT ── */
$('signoutBtn').addEventListener('click', function(){
  stopCam();
  localStorage.removeItem('cm_sess');
  sess = null; inv = null;
  hide('app'); hide('resultArea'); hide('notice');
  show('login'); show('scanArea');
  $('loginBtn').disabled = false;
  $('loginBtn').textContent = 'Sign In';
  $('em').value = ''; $('pw').value = '';
});

/* ── CAMERA ── */
function startCam(){
  hide('vfIdle'); show('vfLoad');
  hide('scanArea');
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080} },
    audio: false
  }).then(function(stream){
    camStream = stream;
    var video = $('video');
    video.srcObject = stream;
    return video.play().then(function(){
      var track = stream.getVideoTracks()[0];
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.torch) show('torchBtn');
      try { track.applyConstraints({advanced:[{focusMode:'continuous',exposureMode:'continuous'}]}); } catch(e){}
      hide('vfLoad'); show('vfActive'); show('closeBtn');
      scanning = true;
      if ('BarcodeDetector' in window) {
        detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
        scanLoop();
      } else {
        show('scanArea');
        showNotice('Camera active — type barcode below if auto-scan fails', false);
      }
    });
  }).catch(function(e){
    hide('vfLoad'); show('vfIdle'); show('scanArea');
    showNotice('Camera error: ' + (e.message || 'Permission denied'), false);
  });
}

function scanLoop(){
  if (!scanning || !detector) return;
  var video = $('video');
  detector.detect(video).then(function(codes){
    if (codes && codes.length) {
      var best = codes[0];
      codes.forEach(function(c){ if ((c.boundingBox||{}).width > (best.boundingBox||{}).width) best = c; });
      if (best.rawValue) {
        try { navigator.vibrate(80); } catch(e){}
        var fl = $('flash'); fl.style.opacity = '1'; setTimeout(function(){ fl.style.opacity = '0'; }, 300);
        stopCam();
        lookupMed(best.rawValue);
        return;
      }
    }
    frameId = requestAnimationFrame(scanLoop);
  }).catch(function(){ frameId = requestAnimationFrame(scanLoop); });
}

function stopCam(){
  scanning = false;
  cancelAnimationFrame(frameId);
  if (camStream) { camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
  hide('vfActive'); hide('vfLoad'); hide('closeBtn'); hide('torchBtn');
  show('vfIdle'); show('scanArea');
}

var torchOn = false;
$('torchBtn').addEventListener('click', function(){
  if (!camStream) return;
  torchOn = !torchOn;
  try { camStream.getVideoTracks()[0].applyConstraints({advanced:[{torch: torchOn}]}); } catch(e){}
  $('torchBtn').textContent = torchOn ? '💡' : '🔦';
});

$('scanBtn').addEventListener('click', startCam);
$('scanBtn').addEventListener('touchend', function(e){ e.preventDefault(); startCam(); });
$('closeBtn').addEventListener('click', stopCam);
$('closeBtn').addEventListener('touchend', function(e){ e.preventDefault(); stopCam(); });

/* ── SEARCH ── */
$('searchToggle').addEventListener('click', function(){
  show('searchRow'); $('searchInput').focus();
  hide('searchToggle');
});
$('searchToggle').addEventListener('touchend', function(e){
  e.preventDefault(); show('searchRow'); $('searchInput').focus(); hide('searchToggle');
});
$('searchX').addEventListener('click', function(){ hide('searchRow'); show('searchToggle'); });
$('searchX').addEventListener('touchend', function(e){ e.preventDefault(); hide('searchRow'); show('searchToggle'); });
$('searchGo').addEventListener('click', function(){
  var q = $('searchInput').value.trim();
  if (q) { $('searchInput').value = ''; hide('searchRow'); show('searchToggle'); lookupMed(q); }
});
$('searchGo').addEventListener('touchend', function(e){
  e.preventDefault();
  var q = $('searchInput').value.trim();
  if (q) { $('searchInput').value = ''; hide('searchRow'); show('searchToggle'); lookupMed(q); }
});
$('searchInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { var q = this.value.trim(); if (q) { this.value = ''; hide('searchRow'); show('searchToggle'); lookupMed(q); } }
});

/* ── LOOKUP ── */
function lookupMed(barcode){
  if (!sess) return;
  show('busyBox'); hide('resultArea'); hideNotice(); hide('scanArea');
  fetch(STOCK, {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + sess.access_token},
    body: JSON.stringify({action:'lookup', barcode: barcode})
  })
  .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
  .then(function(res){
    hide('busyBox');
    if (!res.ok) throw new Error(res.d.error || 'Medicine not found');
    inv = res.d;
    showResult(res.d);
  })
  .catch(function(e){
    hide('busyBox'); show('scanArea');
    showNotice(e.message || 'Not found', false);
  });
}

/* ── RESULT ── */
function showResult(data){
  $('rName').textContent = data.medicine.name;
  $('rMeta').textContent = [data.medicine.strength, data.medicine.dosage_form].filter(Boolean).join(' · ') || '';
  $('rBarcode').textContent = data.medicine.barcode;
  $('rLocation').textContent = '📍 ' + (data.branch && data.branch.name ? data.branch.name : '');
  var qty = data.inventory.quantity;
  var min = data.inventory.minimum_stock || 10;
  var el = $('rStock');
  el.textContent = qty;
  el.className = 'stock-num ' + (qty <= min ? 'low' : 'ok');
  $('qtyVal').value = 1;
  setMoveType('stock_out');
  show('resultArea');
}

$('backBtn').addEventListener('click', function(){ inv = null; hide('resultArea'); show('scanArea'); hideNotice(); });
$('backBtn').addEventListener('touchend', function(e){ e.preventDefault(); inv = null; hide('resultArea'); show('scanArea'); hideNotice(); });

/* ── MOVEMENT ── */
function setMoveType(t){
  moveType = t;
  document.querySelectorAll('.move-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('[data-type="' + t + '"]').classList.add('active');
  var labels = {stock_out:'Stock Out', stock_in:'Stock In', return:'Return', adjustment:'Set Count'};
  $('qtyTitle').textContent = t === 'adjustment' ? 'New Stock Count' : 'Quantity';
  $('confirmBtn').textContent = '✓  Confirm ' + labels[t];
}
document.querySelectorAll('.move-btn').forEach(function(b){
  b.addEventListener('click', function(){ setMoveType(this.dataset.type); });
  b.addEventListener('touchend', function(e){ e.preventDefault(); setMoveType(this.dataset.type); });
});

/* ── QTY ── */
$('qtyMinus').addEventListener('click', function(){ var v = parseInt($('qtyVal').value)||1; $('qtyVal').value = Math.max(1, v-1); });
$('qtyMinus').addEventListener('touchend', function(e){ e.preventDefault(); var v = parseInt($('qtyVal').value)||1; $('qtyVal').value = Math.max(1, v-1); });
$('qtyPlus').addEventListener('click', function(){ $('qtyVal').value = (parseInt($('qtyVal').value)||1) + 1; });
$('qtyPlus').addEventListener('touchend', function(e){ e.preventDefault(); $('qtyVal').value = (parseInt($('qtyVal').value)||1) + 1; });

/* ── CONFIRM ── */
$('confirmBtn').addEventListener('click', doConfirm);
$('confirmBtn').addEventListener('touchend', function(e){ e.preventDefault(); doConfirm(); });

function doConfirm(){
  if (!inv || !sess) return;
  var qty = parseInt($('qtyVal').value) || 1;
  var btn = $('confirmBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> &nbsp;Processing...';
  var ref = 'scan-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  fetch(STOCK, {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + sess.access_token},
    body: JSON.stringify({
      action:'commit',
      barcode: inv.medicine.barcode,
      inventory_id: inv.inventory.id,
      quantity: qty,
      transaction_type: moveType,
      transaction_at: new Date().toISOString(),
      client_reference_id: ref
    })
  })
  .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
  .then(function(res){
    if (!res.ok) throw new Error(res.d.error || 'Update failed');
    var newQty = res.d.inventory.quantity;
    var el = $('rStock'); el.textContent = newQty;
    el.className = 'stock-num ' + (newQty <= (inv.inventory.minimum_stock||10) ? 'low' : 'ok');
    try { navigator.vibrate(100); } catch(e){}
    showNotice('✓ Stock updated — ' + newQty + ' units remaining', true);
    $('qtyVal').value = 1;
  })
  .catch(function(e){ showNotice(e.message || 'Update failed', false); })
  .finally(function(){
    btn.disabled = false;
    setMoveType(moveType);
  });
}
</script>
</body>
</html>
